services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: neurox-backend:prod
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://neurox:neurox@postgres:5432/neurox?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://neurox:neurox@rabbitmq:5672
      RABBITMQ_URLS: amqp://neurox:neurox@rabbitmq:5672
      RABBITMQ_MAIL_QUEUE: mail.outbound
      APP_BASE_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3000:3000"
    # `node` directly rather than `pnpm run start:prod`, which is what this
    # used to be and why the container crash-looped: the `runner` stage copies
    # `package.json` but not `pnpm-lock.yaml`, so pnpm 12 cannot verify the
    # installed tree and re-installs on every start — which runs the root
    # `prepare` script, and `husky` is a devDependency absent from the prod
    # image (`sh: husky: not found`, exit 127).
    #
    # It also matters for shutdown: as PID 1, pnpm does not forward SIGTERM to
    # its child, so `enableGracefulShutdown` would never see the signal it
    # drains on. This mirrors `docker-compose.uat.yml`, which has always
    # invoked `node` directly.
    command: ["node", "dist/main.js"]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: neurox-backend:prod
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://neurox:neurox@postgres:5432/neurox?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://neurox:neurox@rabbitmq:5672
      RABBITMQ_URLS: amqp://neurox:neurox@rabbitmq:5672
      RABBITMQ_MAIL_QUEUE: mail.outbound
      APP_BASE_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Both reasons above apply unchanged; the worker has no HTTP server, so the
    # signal path is the only one that ends it. The path matches
    # `start:worker:prod` in package.json, as `docker-compose.uat.yml` notes.
    command: ["node", "dist/worker.main.js"]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: neurox
      RABBITMQ_DEFAULT_PASS: neurox
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neurox
      POSTGRES_USER: neurox
      POSTGRES_PASSWORD: neurox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurox -d neurox"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
