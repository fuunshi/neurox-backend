services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    image: neurox-backend:dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://neurox:neurox@postgres:5432/neurox?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://neurox:neurox@rabbitmq:5672
      RABBITMQ_URLS: amqp://neurox:neurox@rabbitmq:5672
      APP_BASE_URL: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: [ "sh", "docker/entrypoint.dev.sh", "pnpm", "run", "start:dev" ]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    image: neurox-backend:dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://neurox:neurox@postgres:5432/neurox?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://neurox:neurox@rabbitmq:5672
      RABBITMQ_URLS: amqp://neurox:neurox@rabbitmq:5672
      APP_BASE_URL: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    command: [ "sh", "docker/entrypoint.dev.sh", "pnpm", "run", "start:worker:dev" ]

  redis:
    image: redis:7.4-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "16379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: neurox
      RABBITMQ_DEFAULT_PASS: neurox
    ports:
      - "5674:5672"
      - "15674:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neurox
      POSTGRES_USER: neurox
      POSTGRES_PASSWORD: neurox
    ports:
      - "15432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U neurox -d neurox" ]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:8025" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app_node_modules:
  worker_node_modules:
  postgres_dev_data:
