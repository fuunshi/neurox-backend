name: UAT — Build & Deploy
 
on:
  push:
    branches:
      - uat
 
concurrency:
  group: uat-deploy
  cancel-in-progress: false
 
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/neurox-backend
 
jobs:
  # ──────────────────────────────────────────
  # 1. CI: lint, type-check, test
  # ──────────────────────────────────────────
  ci:
    name: CI checks
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
 
      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
 
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
 
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
 
 
      - name: Type-check
        run: pnpm exec tsc --noEmit   # no typecheck script in package.json, call tsc directly
 
      # Calls eslint directly rather than `pnpm run lint`, which passes `--fix`:
      # rewriting files is the opposite of what a check should do.
      - name: Lint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      # No `--passWithNoTests`: that flag lets the gate pass when the specs
      # disappear, which is the one failure it exists to catch.
      - name: Unit tests
        run: pnpm run test
 
  # ──────────────────────────────────────────
  # 2. Build & push Docker image
  # ──────────────────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: ci
 
    permissions:
      contents: read
      packages: write
 
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.push.outputs.digest }}
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=uat
            type=sha,prefix=uat-,format=short
 
      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
  # ──────────────────────────────────────────
  # 3. Deploy to UAT server
  # ──────────────────────────────────────────
  deploy:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: build
    environment: uat
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Copy compose file to UAT server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "docker-compose.uat.yml"
          target: "/opt/neurox"
 
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,REGISTRY,IMAGE_NAME
          script: |
            set -euo pipefail
 
            # Login using the pipeline's own token — no stored credentials needed
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
 
            cd /opt/neurox
 
            # Pull latest image
            docker pull $REGISTRY/$IMAGE_NAME:uat
 
            # Apply pending MikroORM migrations before restarting. This reads
            # the compiled config at dist/mikro-orm.config.js and the compiled
            # migrations under dist/migrations.
            docker run --rm \
              --env-file /opt/neurox/.env.uat \
              $REGISTRY/$IMAGE_NAME:uat \
              node_modules/.bin/mikro-orm migration:up
 
            # Rolling restart of app and worker only (rabbitmq/mailpit untouched)
            docker compose -f docker-compose.uat.yml up -d --no-deps app worker
 
            # Prune old dangling images
            docker image prune -f
 
            echo "✅ UAT deployment complete — $(date -u)"
 
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.warning(`UAT deployment failed for commit ${context.sha.slice(0,7)}. Check the workflow run.`);
